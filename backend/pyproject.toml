[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Backend"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
    "celery",
    "redis",
    "alembic",
    "svix",
    "openai>=2.31.0",
    "langchain-community>=0.4.1",
    "pypdf>=6.9.2",
    "docx2txt>=0.9",
    "python-multipart>=0.0.26",
    "aiofiles>=25.1.0",
    "python-jose[cryptography]>=3.5.0",
    "httpx>=0.28.1",
    "pyjwt>=2.12.1",
]
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "ruff>=0.15.10",
]
