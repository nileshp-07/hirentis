# PR-Agent configuration. Read from the default branch (main).
# Reference: https://github.com/The-PR-Agent/pr-agent

[ignore]
glob = [
  'frontend/package-lock.json',
  'backend/uv.lock',
  'frontend/public/**',
  'frontend/src/components/ui/**',   # generated shadcn components
  'backend/alembic/versions/**',     # autogenerated migrations
]

[pr_reviewer]
num_max_findings = 5
extra_instructions = """
Project: Hirentis, an AI interview platform. Backend: FastAPI + sync SQLAlchemy + PostgreSQL + Alembic + OpenAI. Frontend: Next.js (App Router, JavaScript) + RTK Query + Clerk + Tailwind/shadcn.
Focus on correctness, security and data-ownership bugs, not style (Ruff, ESLint and Prettier already run in a pre-commit hook).
Backend rules:
- API routes only handle request/response; business logic lives in app/services, all LLM code in app/ai.
- Every query on user-owned data must filter by the current user's id.
- DB-backed routes are plain `def` (sync session); flag `async def` routes that touch the DB or call the LLM synchronously.
- LLM calls go through app/ai/llm/openai_client.py (generate_structured with Pydantic schemas); flag failures that are swallowed or persisted as fake data.
- Model changes need an Alembic migration.
Frontend rules:
- API calls go through RTK Query slices in src/redux/api; flag raw fetch calls.
- Flag setState inside effects, missing loading/error states, and API errors that are not shown to the user.
"""

[pr_code_suggestions]
extra_instructions = """
Prefer small, concrete fixes that match the existing code style. Skip purely cosmetic suggestions.
"""
